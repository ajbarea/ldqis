name: Deploy to GitHub Pages

# research(2026-05): standard Astro static-deploy workflow. Action pins
# match the broader sister-toolchain parity convention: full commit SHAs
# with major.minor.patch comments so the sister-audit can detect drift,
# and the family wave-bumps together. `pages: write` + `id-token: write`
# are scoped to the deploy job (the only step that needs them); the build
# job runs read-only.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # M5 custom-domain switch. Set repo variable CUSTOM_DOMAIN=true
          # (Settings > Secrets and variables > Actions > Variables) once
          # Dr. Reznik points dataqualitylabs.com DNS at GitHub Pages.
          # astro.config flips site/base to the apex; the next step emits CNAME.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Write CNAME (custom domain only)
        if: ${{ vars.CUSTOM_DOMAIN == 'true' }}
        run: echo "dataqualitylabs.com" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
