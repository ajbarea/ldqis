name: Deploy to GitHub Pages

# research(2026-05): standard Astro static-deploy workflow. Action pins
# match the broader sister-toolchain parity convention: exact
# major.minor.patch tags so the sister-audit cron can detect drift, and
# the family wave-bumps together. `pages: write` + `id-token: write`
# permissions are the minimum required for the deploy step; nothing else
# is granted.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # M5 custom-domain switch. Set repo variable CUSTOM_DOMAIN=true
          # (Settings > Secrets and variables > Actions > Variables) once
          # Dr. Reznik points dataqualitylabs.com DNS at GitHub Pages.
          # astro.config flips site/base to the apex; the next step emits CNAME.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Write CNAME (custom domain only)
        if: ${{ vars.CUSTOM_DOMAIN == 'true' }}
        run: echo "dataqualitylabs.com" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
