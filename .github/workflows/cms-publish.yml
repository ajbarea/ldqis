name: CMS publish

# research(2026-06): Sveltia commits /admin edits straight to the unprotected `cms`
# branch — it has no PR/editorial mode yet (sveltiacms.app/en/docs/roadmap) — and a
# direct write to protected `main` is rejected with "required status checks are
# expected". This bridges cms -> main the sanctioned way: open a PR so the existing
# ci.yml runs, then auto-merge once the required checks pass. main's protection is
# never bypassed — the merge is legitimate (no review required; content-only PRs
# fast-pass the app suite and run Build + pin-check).
#
# The PR is authored with a scoped GitHub App token, not GITHUB_TOKEN: a GITHUB_TOKEN
# PR doesn't trigger workflows (same reason the intake jobs validate inline), so its
# required checks would sit Pending forever. Everything goes through the REST API — no
# checkout, so no persisted credentials — and the PR head is a throwaway `cms-pub` ref
# so the long-lived `cms` branch survives delete-on-merge.

on:
  push:
    branches: [cms]

# Fold rapid saves into one PR instead of racing several.
concurrency:
  group: cms-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CMS_APP_ID }}
          private-key: ${{ secrets.CMS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or refresh the cms -> main PR and arm auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Nothing to publish if cms has no file changes vs main (e.g. after a sync).
          changed="$(gh api "repos/$REPO/compare/main...cms" --jq '.files | length')"
          if [ "$changed" -eq 0 ]; then
            echo "cms has no changes vs main; nothing to publish."
            exit 0
          fi
          # Point the throwaway head at the current cms tip; an open PR re-runs CI.
          cms_sha="$(gh api "repos/$REPO/branches/cms" --jq '.commit.sha')"
          if gh api "repos/$REPO/git/ref/heads/cms-pub" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/cms-pub" -f sha="$cms_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/cms-pub" -f sha="$cms_sha" >/dev/null
          fi
          # One open PR at a time; an existing one already tracks the refreshed head.
          if [ -z "$(gh pr list --head cms-pub --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head cms-pub \
              --title "Publish CMS content edits" \
              --body "Automated bridge from the cms branch; auto-merges once the required checks pass."
          fi
          gh pr merge cms-pub --auto --squash --delete-branch
