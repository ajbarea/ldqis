name: Add a publication
description: Add a journal paper, conference paper, or book to the website.
title: "[publication] Title"
labels: ["publication"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and submit — a maintainer gets a pull request to review, no files to touch.
        Author links (to lab-member pages) are added by a maintainer on review; the typed author
        list below is what shows as the citation.
  - type: input
    id: authors
    attributes:
      label: Authors
      description: The full author list as it should read, in order.
      placeholder: D. Korobeinikov, R. Zatsarenko, A. Barea, I. Khokhlov, L. Reznik
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "2026"
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Journal or conference name — or the publisher, for a book.
      placeholder: IEEE Intelligent Systems
    validations:
      required: true
  - type: dropdown
    id: venue_type
    attributes:
      label: Venue type
      options:
        - journal
        - conference
        - book
    validations:
      required: true
  - type: input
    id: isbn
    attributes:
      label: ISBN (books only, optional)
      description: ISBN-10 or ISBN-13.
      placeholder: "978-1-119-77153-1"
  - type: input
    id: link_url
    attributes:
      label: Link (DOI, paper, or publisher URL)
      placeholder: https://doi.org/10.1109/MIS.2026.0000000
    validations:
      required: true
  - type: input
    id: link_label
    attributes:
      label: Link label (optional)
      description: Defaults to "DOI ↗".
      placeholder: DOI ↗
  - type: textarea
    id: abstract
    attributes:
      label: Abstract or summary (optional)
      description: "A short paragraph for the publication page: a paper's abstract, or a book's summary."
