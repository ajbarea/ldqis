# Dependabot version updates: npm + GitHub Actions, weekly, minor/patch
# grouped one PR per ecosystem.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Astro held at 5.x until withastro/astro#16542 (the @tailwindcss/vite
      # vs Astro 6 rolldown incompatibility) closes — see IMPL.md. Minor/patch
      # 5.x updates still flow; only the 6.x major is held back.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # SHA-pinned actions get version updates (not security alerts); cooldown holds
    # a freshly-published release 7 days so a compromise can surface before the bump.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
