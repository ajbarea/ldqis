name: CMS sync

# research(2026-06): keep the `cms` branch (Sveltia's commit target) current with
# `main` so the next cms -> main PR stays a clean, minimal diff and content that
# reached main another way — an intake-form PR, a direct maintainer edit — is never
# reverted by a later CMS save. Uses the REST merge API (no checkout, no persisted
# credentials); the merge commit is made with GITHUB_TOKEN, whose pushes don't cascade
# into workflows, so this can't re-trigger CMS publish. A genuine same-file conflict
# fails loudly for a maintainer to resolve (rare).

on:
  push:
    branches: [main]

concurrency:
  group: cms-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge main into cms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dormant until the cms branch exists.
          if ! gh api "repos/$REPO/branches/cms" >/dev/null 2>&1; then
            echo "cms branch does not exist yet; nothing to sync."
            exit 0
          fi
          # Server-side merge: 201 merged / 204 already up to date → ok; 409 conflict → fail.
          if gh api -X POST "repos/$REPO/merges" -f base=cms -f head=main >/dev/null 2>&1; then
            echo "cms is in sync with main."
          else
            echo "::error::could not merge main into cms (conflict?); resolve manually."
            exit 1
          fi
