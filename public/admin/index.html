<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>LDQIS · Content editor</title>
    <style>
      /* 16px textboxes keep iOS Safari from zooming on focus now that pinch zoom is on. */
      html:root {
        --sui-textbox-font-size: 16px;
      }
    </style>
    <script>
      // Sveltia injects a viewport meta with maximum-scale=1; keep pinch zoom (WCAG 1.4.4).
      (function () {
        var content = "width=device-width, initial-scale=1, interactive-widget=resizes-content";
        function fix() {
          document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
            if (m.content !== content) m.content = content;
          });
        }
        new MutationObserver(fix).observe(document.head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["content"],
        });
        fix();
      })();
    </script>
  </head>
  <body>
    <script src="cms/sveltia-cms.js"></script>
  </body>
</html>
