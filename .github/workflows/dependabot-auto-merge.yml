name: Dependabot auto-merge

# research(2026-06): auto-merge Dependabot PRs that bump only patch versions.
# Patch is non-breaking by semver, dependabot.yml already holds new releases 7d
# (the supply-chain cooldown), and main's required checks gate the merge — so the
# human click this removes was toil, not review. Minor/major still wait for a
# person: a grouped PR reports its HIGHEST bump, so any minor in the weekly batch
# holds the whole batch.
#
# Uses GITHUB_TOKEN (elevated via permissions), not the CMS GitHub App token that
# cms-publish.yml uses: a Dependabot-triggered run can only read Dependabot
# secrets, not Actions secrets, so that key isn't reachable here
# (docs.github.com/code-security/dependabot/.../automating-dependabot-with-github-actions).
# Trade-off: a GITHUB_TOKEN merge doesn't re-trigger deploy.yml, so a prod-dep
# patch goes live on the next push to main rather than instantly. Immaterial for a
# static site whose Dependabot traffic is dev-deps + action bumps (no build-output
# change). The 7 required checks still gate every merge, same as a human's.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependabot's own PRs only; skipped (and so non-blocking) on every other PR.
    # pull_request.user.login (not the spoofable github.actor) is the robust gate.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ajbarea/ldqis'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Arm auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
