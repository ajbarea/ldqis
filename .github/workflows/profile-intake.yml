name: Profile intake

# A submitted "profile" issue form becomes a reviewed PR (people/<slug>.md +
# optional avatar). The issue body is untrusted input: it reaches the script
# only through `env` (never interpolated into a shell), the script host-allowlists
# the photo URL and sanitises the slug, and the sole repo write is an isolated PR
# a maintainer reviews — nothing auto-merges.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  intake:
    # The profile form auto-applies the `profile` label; ignore every other issue.
    if: contains(github.event.issue.labels.*.name, 'profile')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3
        id: parse
        with:
          template-path: .github/ISSUE_TEMPLATE/profile.yml

      - name: Build profile from the issue
        id: build
        env:
          ISSUE_JSON: ${{ steps.parse.outputs.jsonString }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/profile_intake.py

      # research(2026-05): a GITHUB_TOKEN PR doesn't trigger ci.yml, so validate the
      # generated card here. Must be `astro build` — `astro check` doesn't validate
      # content-collection schemas (withastro/astro#12417).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Validate the generated card builds
        run: npm run build

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: profile/intake-${{ github.event.issue.number }}
          base: main
          title: "${{ steps.build.outputs.action }} profile: ${{ steps.build.outputs.name }}"
          commit-message: "feat(people): profile from #${{ github.event.issue.number }}"
          body: |
            Generated from #${{ github.event.issue.number }} via the profile form.

            Please review, then merge — it deploys automatically. New cards auto-append to the end of the list; edit `order` in the file only if you want to feature this person higher.

            Closes #${{ github.event.issue.number }}
          labels: profile
          add-paths: |
            src/content/people/**
